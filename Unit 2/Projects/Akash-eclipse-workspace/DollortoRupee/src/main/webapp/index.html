
<!DOCTYPE html>
<html>
<head>
    <title>Rupee Converter</title>
</head>

<body style="font-family: Arial; margin: 50px;">

    <h2 style="color: darkblue;">
        Dollar to Rupee Converter
    </h2>

    <form action="convert" method="get">

        <input
            type="number"
            name="amount"
            placeholder="Enter amount in ₹"
            style="
                padding: 10px;
                width: 200px;
                border: 1px solid gray;
                border-radius: 5px;
            "
        >

        <button
            type="submit"
            style="
                padding: 10px 20px;
                margin-left: 10px;
                background-color: green;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            "
        >
            Submit
        </button>

    </form>

</body>
</html>
